name: CI

on:
  pull_request:
    types: [opened, synchronize, reopened]
  merge_group:
  push:
    branches: [main]
    tags: ["v*"]

concurrency:
  # Fold the commit in for pushes, so every main push gets its own group and
  # can never displace another. github.sha is empty on pull_request, so PRs
  # keep superseding themselves; merge_group is unaffected.
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.event_name == 'push' && github.sha || '' }}
  # Only a pull_request supersedes itself. Cancelling a merge_group entry can
  # eject the PR from the queue.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  packaging:
    name: The wheel works on a cold box
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      # A PLATFORM wheel, which is what a user on this OS installs. The pure
      # wheel is the fallback for platforms with no build, and it cannot carry
      # the binaries this job exists to check.
      - name: Build the platform wheel
        run: LITELINK_WHEEL_PLATFORM=linux-x86_64 uv build --wheel --out-dir dist

      # The claim the README makes: no network, nothing on PATH, no DuckDB
      # extension cache. Every one of those has produced a real failure — a
      # missing binary found during a failover, an `iceberg` that autoinstalls
      # on a laptop and cannot on the target, an `avro` pulled in from inside
      # another extension's init. None reproduce on a warm developer machine.
      - name: Install and run it with no egress
        run: |
          uv venv --python 3.11 cold
          uv pip install --python cold/bin/python dist/*.whl
          cold_home=$(mktemp -d)
          cd /tmp && env -i "HOME=$cold_home" PATH=/usr/bin:/bin \
            unshare --map-root-user --net \
            "$GITHUB_WORKSPACE/cold/bin/python" - <<'PY'
          import os, shutil, tempfile
          from pathlib import Path
          import pyarrow as pa
          import litelink

          assert os.system("ping -c1 -W1 8.8.8.8 >/dev/null 2>&1") != 0, "expected no network"
          assert shutil.which("litestream") is None, "expected nothing on PATH"
          assert not os.listdir(os.environ["HOME"]), "expected an empty HOME"

          report = litelink.preflight(replication=True)
          print(report)
          report.raise_if_not_ready()

          schema = pa.schema([pa.field("event_ts", pa.int64(), nullable=False)])
          with litelink.new(Path(tempfile.mkdtemp()), "cold", schema=schema) as log:
              log.extend([{"event_ts": i} for i in range(500)])
              log.seal_due()
              assert log.scan().read_all().num_rows == 500
              assert log.sql("SELECT count(*) c FROM log").read_all()["c"][0].as_py() == 500

          print("cold box: preflight READY, 500 rows through DuckDB")
          PY

  lint:
    name: Lint + format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv sync
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: python scripts/check_blank_lines.py

  typecheck:
    name: Type check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv sync
      - run: uv run ty check

  test:
    name: Tests (${{ matrix.python-version }})
    runs-on: ubuntu-latest

    # An S3-compatible endpoint, because without one the ENTIRE archive tier
    # skips — and it did, silently, for the whole life of this workflow. The
    # tier most of this library's bugs have been found in was never run here.
    # What finally said so was `286 passed, 1 skipped, 91 errors`, and only
    # because s3fs became a dev dependency and the skip turned into an error.
    #
    # Same image and credentials as `just rustfs`, so CI and a developer
    # machine are one environment rather than two that drift.
    services:
      rustfs:
        image: rustfs/rustfs:latest
        env:
          RUSTFS_ACCESS_KEY: litelink
          RUSTFS_SECRET_KEY: litelink-secret
        ports:
          - 9000:9000

    strategy:
      fail-fast: false
      matrix:
        # The declared floor and the current top of the supported range. The
        # floor is what .python-version pins locally, so a 3.13-only regression
        # is the one CI catches that a dev machine does not.
        python-version: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          python-version: ${{ matrix.python-version }}
      - run: uv sync
      # The read path's DuckDB extensions are downloaded, not bundled. Doing it
      # as its own step means a fetch failure reads as a provisioning failure
      # rather than as a mysterious IO error inside a test.
      - run: uv run python scripts/install_duckdb_extensions.py

      # Then assert the box can load them with autoinstall off — the same check
      # an offline deployment target would run. This is what catches a new
      # extension being added to the read path without being added here.
      - run: uv run python scripts/install_duckdb_extensions.py --check
      # Any HTTP answer means it is listening. NOT `curl -f`: an unauthenticated
      # S3 root answers 403, which is a healthy server refusing an anonymous
      # request, and -f reads that as a failure. Same check `just rustfs` makes.
      - name: Wait for the S3 endpoint
        run: |
          for _ in $(seq 1 60); do
            if curl -s -o /dev/null http://127.0.0.1:9000 2>/dev/null; then
              echo "rustfs is listening"; exit 0
            fi
            sleep 1
          done
          echo "rustfs never came up; the archive tier would not run" >&2
          exit 1
      # tests/test_offline.py proves I5 by running the capture loop inside a
      # network namespace, which Ubuntu blocks for unprivileged users through
      # AppArmor. Without this the suite still passes — the tests skip — and
      # the library's central claim quietly stops being checked anywhere.
      # Tolerated if the knob is absent, since the skip is then correct.
      - name: Allow unprivileged user namespaces
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true
      - run: uv run pytest -q

  ci-success:
    name: CI success
    if: always()
    needs: [lint, typecheck, test]
    runs-on: ubuntu-latest
    steps:
      # One required check for branch protection / the merge queue. Reading the
      # aggregate result rather than each `needs.*.result` means a job added
      # later is covered without editing this gate.
      - if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: exit 1
