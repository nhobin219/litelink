name: Release

# Cutting a tag is the whole trigger. CI already runs on `v*` pushes too, so the
# suite and this workflow start together — but publishing is gated on the checks
# below rather than on that run, because a job that publishes must not depend on
# a green light it cannot see.
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  build:
    name: Build and check the tag
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      # The tag and the version in pyproject.toml are two statements of the same
      # fact, and PyPI will not let the second one be corrected later: a release
      # is immutable, so a `v0.2.0` tag that ships 0.1.0 burns the version
      # number. Fail before anything is built.
      - name: Tag matches the packaged version
        run: |
          tagged="${GITHUB_REF_NAME#v}"
          packaged=$(uv version --short)
          if [ "$tagged" != "$packaged" ]; then
            echo "tag $GITHUB_REF_NAME declares $tagged, pyproject.toml says $packaged" >&2
            exit 1
          fi
          echo "both say $packaged"

      # The sdist, plus one wheel per published platform. All of them build
      # here: `vendor_litestream.py` and `vendor_duckdb_extension.py` fetch by
      # platform rather than for the host, so a macOS arm64 wheel is produced
      # on this Linux runner. That keeps the matrix in one job and means every
      # wheel of a release is cut from one checkout.
      - name: Build the sdist and every platform wheel
        run: |
          uv build --sdist
          for platform in linux-x86_64 linux-arm64 macos-x86_64 macos-arm64; do
            LITELINK_WHEEL_PLATFORM="$platform" uv build --wheel
          done
          ls -la dist/

      # A wheel that shipped without its binaries would install fine and fail
      # at the first restore. Assert the contents rather than trusting the hook.
      - name: Every wheel carries its binaries
        run: |
          uv run --no-project python - <<'PY'
          import sys, zipfile
          from pathlib import Path

          wheels = sorted(Path("dist").glob("*.whl"))
          platform_wheels = [w for w in wheels if "none-any" not in w.name]
          assert len(platform_wheels) == 4, f"expected 4 platform wheels, got {[w.name for w in wheels]}"

          for wheel in platform_wheels:
              names = zipfile.ZipFile(wheel).namelist()
              assert any(n.endswith(".bin/litestream") for n in names), f"{wheel.name}: no litestream"
              for extension in ("avro", "iceberg", "httpfs"):
                  assert any(n.endswith(f"{extension}.duckdb_extension") for n in names), (
                      f"{wheel.name}: no {extension}"
                  )
              print(f"{wheel.name}: litestream + avro + iceberg + httpfs")
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  smoke:
    name: Install the wheel and capture a row
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      # Against the built WHEEL in a clean environment, not the source tree.
      # This is the one check that covers what a user actually installs: a
      # missing package directory, an unshipped py.typed, a dependency declared
      # in the dev group by accident. None of those fail in a repo checkout.
      # On a COLD box, which is the claim the README makes and the reason the
      # binaries ship at all: no network, nothing on PATH, no DuckDB extension
      # cache. Provisioning the extensions here first — as this step used to —
      # would test a machine no user has.
      - name: Round-trip a row with no egress
        run: |
          uv venv --python 3.11 cold
          uv pip install --python cold/bin/python \
            dist/litelink-*-manylinux_2_17_x86_64*.whl
          cold_home=$(mktemp -d)
          cd /tmp && env -i "HOME=$cold_home" PATH=/usr/bin:/bin \
            unshare --map-root-user --net \
            "$GITHUB_WORKSPACE/cold/bin/python" - <<'PY'
          import os, shutil, tempfile
          from pathlib import Path
          import pyarrow as pa
          import litelink

          assert os.system("ping -c1 -W1 8.8.8.8 >/dev/null 2>&1") != 0
          assert shutil.which("litestream") is None

          print(f"litelink {litelink.__version__}")
          litelink.preflight(replication=True).raise_if_not_ready()

          schema = pa.schema([pa.field("event_ts", pa.int64(), nullable=False)])
          with litelink.new(Path(tempfile.mkdtemp()), "smoke", schema=schema) as log:
              log.append({"event_ts": 1})
              assert log.scan().read_all().num_rows == 1

          print("cold box: preflight READY, append and read back ok")
          PY

  publish:
    name: Publish to PyPI
    needs: smoke
    runs-on: ubuntu-latest
    # Trusted publishing: PyPI verifies this workflow's OIDC identity, so there
    # is no API token in the repository to leak or rotate. It requires a
    # publisher configured on the PyPI project side — owner, repo, workflow
    # filename, and this environment name must all match what is registered
    # there, or the upload is rejected.
    environment:
      name: pypi
      url: https://pypi.org/p/litelink
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1

  github-release:
    name: GitHub release
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      # Notes generated from the commits since the last tag. The history is
      # written to be read — Conventional Commits with a body explaining the
      # why — so generated notes are worth more here than a hand-written
      # summary that says less.
      - run: gh release create "$GITHUB_REF_NAME" dist/* --generate-notes --verify-tag
        env:
          GH_TOKEN: ${{ github.token }}
